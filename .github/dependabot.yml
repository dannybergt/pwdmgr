# Dependency lifecycle per Constitution §10: lockfiles committed, versions pinned,
# updates arrive as reviewable PRs instead of "latest" drifting silently.
#
# Major-version policy: platform-level majors (.NET runtime/SDK, TypeScript) are
# coordinated migrations with an ADR, lifted across all projects at once — not
# per-directory Dependabot bumps. They are ignored here; everything else flows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    groups:
      # minor/patch bundled into one PR; majors stay separate so they get a real review
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript majors are lifted for frontend + extension together (see #11).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Must match the mcr.microsoft.com/playwright image tag in ci.yml and TESTING.md; bump both by hand.
      - dependency-name: "@playwright/test"
      # Tracks the Node major used everywhere (setup-node, node:24 build image, TESTING.md) — lifted together (see #38).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /src/extension
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Microsoft.* package majors track the .NET runtime major pinned in global.json.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/compose/docker
    schedule:
      interval: weekly
    ignore:
      # .NET base-image majors follow global.json, not Docker Hub (see #5, #8).
      - dependency-name: mcr.microsoft.com/dotnet/*
        update-types: ["version-update:semver-major"]
      # Node majors are lifted with setup-node, @types/node and TESTING.md together (see #37).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    ignore:
      # A Postgres major is a data-directory migration (pg_upgrade/dump-restore) planned in
      # OPERATIONS.md, not a tag bump — postgres:18 also moved PGDATA and broke the volume (see #33).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
