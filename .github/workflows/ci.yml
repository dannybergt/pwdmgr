name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pwdmgr
          POSTGRES_PASSWORD: pwdmgr-ci-only
          POSTGRES_DB: pwdmgr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwdmgr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore backend
        run: dotnet restore pwdmgr.slnx
      - name: Build backend
        run: dotnet build pwdmgr.slnx --configuration Release --no-restore
      - name: Test backend
        env:
          PWDMGR_TEST_PG: Host=localhost;Database=pwdmgr;Username=pwdmgr;Password=pwdmgr-ci-only
        run: dotnet test pwdmgr.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/extension/package-lock.json
      - name: Install extension
        working-directory: src/extension
        run: npm ci
      - name: Build extension
        working-directory: src/extension
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-api:
    needs: [backend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dbergt/pwdmgr-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=pwdmgr-api
            org.opencontainers.image.description=Privora / pwdmgr API (zero-knowledge vault, modular monolith)
            org.opencontainers.image.vendor=dbergt
            org.opencontainers.image.licenses=Proprietary

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main/tags) pwdmgr-api
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/compose/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=pwdmgr-api
          cache-to: type=gha,scope=pwdmgr-api,mode=max

  docker-web:
    needs: [frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dbergt/pwdmgr-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=pwdmgr-web
            org.opencontainers.image.description=Privora / pwdmgr web client (static, nginx-unprivileged)
            org.opencontainers.image.vendor=dbergt
            org.opencontainers.image.licenses=Proprietary

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main/tags) pwdmgr-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/compose/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=pwdmgr-web
          cache-to: type=gha,scope=pwdmgr-web,mode=max

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start the compose stack (api, web, postgres, traefik with TLS)
        working-directory: infra/compose
        run: |
          cp .env.example .env
          docker compose -p pwdmgr up -d --build
          for i in $(seq 1 60); do
            if curl -sk https://localhost:8443/health/ready | grep -q Healthy; then exit 0; fi
            sleep 2
          done
          docker compose -p pwdmgr logs api
          exit 1
      - name: Run the Playwright golden path against https://localhost:8443
        run: |
          docker run --rm --network host --ipc=host -v "$PWD/src/frontend:/w" -w /w \
            -e E2E_PASSWORD="$(sed -n 's/^SEED_ADMIN_PASSWORD=//p' infra/compose/.env)" \
            mcr.microsoft.com/playwright:v1.63.0-noble sh -c 'npm ci --no-fund --ignore-scripts && npx playwright test'
      - name: Stack logs on failure
        if: failure()
        working-directory: infra/compose
        run: docker compose -p pwdmgr logs
      - name: Stop the stack
        if: always()
        working-directory: infra/compose
        run: docker compose -p pwdmgr down
