services:
  reverse-proxy:
    image: traefik:v3
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro,z
    networks:
      - public
      - app
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../../
      dockerfile: infra/compose/docker/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=pwdmgr;Username=pwdmgr;Password=pwdmgr-dev-only
      Database__MigrateOnStartup: "true"
      Auth__CookieSecurePolicy: SameAsRequest
      Forwarded__KnownNetworks__0: 172.16.0.0/12
      Seed__Enabled: "true"
      Seed__AdminPassword: dev-only-admin-password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data

  web:
    build:
      context: ../../
      dockerfile: infra/compose/docker/web.Dockerfile
    networks:
      - app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pwdmgr
      POSTGRES_USER: pwdmgr
      POSTGRES_PASSWORD: pwdmgr-dev-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwdmgr -d pwdmgr"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

networks:
  public:
  app:
    internal: true
  data:
    internal: true

volumes:
  pgdata:

